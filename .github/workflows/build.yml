name: Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Create placeholder keystore.properties
        # Debug/test tasks never touch the "release" signingConfig, but
        # app/build.gradle.kts unconditionally loads this file for every
        # task. This placeholder is not used to sign anything -- it just
        # lets Gradle's configuration phase succeed. Real release signing
        # uses real secrets, see release.yml.
        run: |
          mkdir -p keystore
          cat > keystore/keystore.properties <<'EOF'
          storeFile=placeholder.keystore
          storePassword=placeholder
          keyAlias=placeholder
          keyPassword=placeholder
          EOF

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: godroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
