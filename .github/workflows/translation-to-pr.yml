name: Translation Issue to PR

# Turns a submitted "Translation" issue into a pull request. Runs when such an
# issue is opened, and again when it is edited, which updates the same PR (so a
# contributor can fix a typo without starting over).
#
# There is no maintainer gate before the PR is opened - the result is only ever
# a pull request, never a commit to main, and nothing is merged automatically.
# What stands between a stranger's text and the repo is:
#   - scripts/apply_translation_issue.sh, which accepts only a valid locale
#     code and known string keys, escapes the text for Android, and refuses
#     unsafe values (see that script);
#   - normal review of the PR before merging.
# The issue body reaches the script through an environment variable, never
# pasted into a shell command. If spam ever becomes a problem, gate this with a
# label again: change the trigger to `labeled` and test the label name.
on:
  issues:
    types: [opened, edited]

# One run per issue at a time, so a quick edit cannot race the first run.
concurrency:
  group: translation-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  open-pr:
    # Only issues made from the translation form (it always has this heading).
    if: ${{ contains(github.event.issue.body, '### Translations') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply translations from the issue
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$ISSUE_BODY" | bash scripts/apply_translation_issue.sh

      - name: Check locale files are still consistent
        run: bash scripts/check_locale_sync.sh

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Translations from #${{ github.event.issue.number }}"
          branch: translation-issue-${{ github.event.issue.number }}
          title: "Translations from #${{ github.event.issue.number }}"
          body: |
            Generated from #${{ github.event.issue.number }} by the
            translation-to-pr workflow. Please review the actual translated
            text before merging - this only checks that the string *keys*
            are valid and the text is safe for Android, not that the
            translation itself is correct.

            Closes #${{ github.event.issue.number }}

      - name: Comment on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks! I've opened (or updated) a pull request with these translations for a maintainer to review."
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Something went wrong turning this into a pull request automatically (maybe the language code or the `key = value` lines need a second look - the details are in the workflow run's log). Editing this issue runs it again. A maintainer will take it from here."
            });
